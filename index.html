<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meri Video</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a1a;
      font-family: Arial, sans-serif;
    }
    .container {
      width: 90%;
      max-width: 900px;
      text-align: center;
    }
    video {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      outline: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <video controls playsinline>
      <source src="video.mp4" type="video/mp4">
      Aapka browser video support nahi karta.
    </video>
  </div>
</body>
</html>
